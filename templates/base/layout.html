<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}FlowTrace{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2358a6ff' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><polyline points='22 12 18 12 15 21 9 3 6 12 2 12'/></svg>" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            surface: '#0d1117',
            panel: '#161b22',
            border: '#30363d',
            accent: '#58a6ff',
            success: '#3fb950',
            warning: '#d29922',
            danger: '#f85149',
            muted: '#8b949e',
          },
          fontFamily: { mono: ['JetBrains Mono', 'Fira Code', 'monospace'] },
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'JetBrains Mono', monospace; background: #0d1117; color: #c9d1d9; }
    .timeline-line { position: relative; }
    .timeline-line::before { content: ''; position: absolute; left: 11px; top: 0; bottom: 0; width: 2px; background: #30363d; }
    .timeline-dot { width: 24px; height: 24px; border-radius: 50%; border: 2px solid #30363d; flex-shrink: 0; }
    .scrollbar-thin::-webkit-scrollbar { width: 4px; }
    .scrollbar-thin::-webkit-scrollbar-track { background: #161b22; }
    .scrollbar-thin::-webkit-scrollbar-thumb { background: #30363d; border-radius: 2px; }
    .pulse-dot { animation: pulse 2s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    /* Toast */
    #toast-container { position: fixed; bottom: 24px; right: 24px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
    .toast { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-radius: 10px; font-size: 13px; font-family: 'JetBrains Mono', monospace; min-width: 240px; max-width: 340px; border: 1px solid; box-shadow: 0 8px 32px rgba(0,0,0,0.5); pointer-events: auto; animation: toastIn .25s cubic-bezier(.34,1.56,.64,1) forwards; }
    .toast.out { animation: toastOut .2s ease forwards; }
    .toast-success { background: #0d2818; border-color: #3fb95055; color: #3fb950; }
    .toast-error   { background: #2d0f0e; border-color: #f8514955; color: #f85149; }
    .toast-info    { background: #0d1f35; border-color: #58a6ff55; color: #58a6ff; }
    .toast-icon { font-size: 16px; flex-shrink: 0; }
    @keyframes toastIn  { from { opacity:0; transform: translateY(16px) scale(.95); } to { opacity:1; transform: translateY(0) scale(1); } }
    @keyframes toastOut { from { opacity:1; transform: translateY(0) scale(1); } to { opacity:0; transform: translateY(8px) scale(.95); } }
    /* Modal entrance */
    .modal-box { animation: modalIn .2s cubic-bezier(.34,1.56,.64,1) forwards; }
    @keyframes modalIn { from { opacity:0; transform: scale(.94) translateY(12px); } to { opacity:1; transform: scale(1) translateY(0); } }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body class="min-h-screen bg-surface">
  {% block body %}{% endblock %}
  <div id="toast-container"></div>

  <!-- Avatar Crop Modal -->
  <div id="avatar-modal" class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center z-[100] px-4">
    <div class="bg-panel border border-border rounded-xl p-6 w-full max-w-sm">
      <h3 class="text-white font-semibold mb-4 text-sm">Crop Profile Picture</h3>
      <div class="relative mx-auto mb-4" style="width:240px;height:240px;">
        <canvas id="crop-canvas" width="240" height="240" class="rounded-full border-2 border-accent cursor-crosshair"></canvas>
      </div>
      <input type="range" id="crop-zoom" min="1" max="3" step="0.01" value="1" class="w-full accent-blue-500 mb-4" />
      <div class="flex gap-2">
        <button onclick="closeCropModal()" class="flex-1 py-2 border border-border text-muted text-sm rounded-md hover:text-white transition">Cancel</button>
        <button onclick="confirmCrop()" class="flex-1 py-2 bg-accent text-surface text-sm font-medium rounded-md hover:bg-blue-400 transition">Upload</button>
      </div>
    </div>
  </div>

  <script>
    const API = {
      async request(method, url, data = null) {
        const token = localStorage.getItem('access_token');
        const opts = {
          method,
          headers: { 'Content-Type': 'application/json', ...(token ? { Authorization: `Bearer ${token}` } : {}) },
        };
        if (data) opts.body = JSON.stringify(data);
        const res = await fetch(url, opts);
        if (res.status === 401) { window.location.href = '/'; return; }
        return res.json();
      },
      get: (url) => API.request('GET', url),
      post: (url, data) => API.request('POST', url, data),
      patch: (url, data) => API.request('PATCH', url, data),
    };
    function toast(msg, type = 'success') {
      const icons = { success: '✓', error: '✕', info: 'ℹ' };
      const el = document.createElement('div');
      el.className = `toast toast-${type}`;
      el.innerHTML = `<span class="toast-icon">${icons[type]}</span><span>${msg}</span>`;
      document.getElementById('toast-container').appendChild(el);
      setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 220); }, 3200);
    }
    const workspace_slug = document.body.dataset.workspace || '';

    // ── Avatar helpers ──────────────────────────────────────────
    function avatar(url, username, size = 'w-8 h-8', textSize = 'text-xs') {
      if (url) {
        return `<img src="${url}" class="${size} rounded-full object-cover border border-border flex-shrink-0" alt="${username}" />`;
      }
      return `<div class="${size} rounded-full bg-surface border border-border flex items-center justify-center ${textSize} text-accent font-mono flex-shrink-0">${(username||'?')[0].toUpperCase()}</div>`;
    }

    // ── Avatar crop & upload ────────────────────────────────────
    let _cropImg = null, _cropZoom = 1, _cropOffset = {x:0,y:0}, _cropDrag = null, _cropCallback = null;

    function openAvatarPicker(onUpload) {
      _cropCallback = onUpload;
      const inp = document.createElement('input');
      inp.type = 'file'; inp.accept = 'image/*';
      inp.onchange = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        if (file.size > 5 * 1024 * 1024) { toast('Image must be 5 MB or less', 'error'); return; }
        const reader = new FileReader();
        reader.onload = (ev) => {
          const img = new Image();
          img.onload = () => {
            _cropImg = img; _cropZoom = 1; _cropOffset = {x:0,y:0};
            document.getElementById('crop-zoom').value = 1;
            document.getElementById('avatar-modal').classList.remove('hidden');
            drawCrop();
          };
          img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
      };
      inp.click();
    }

    function drawCrop() {
      const canvas = document.getElementById('crop-canvas');
      const ctx = canvas.getContext('2d');
      const S = 240;
      ctx.clearRect(0,0,S,S);
      ctx.save();
      ctx.beginPath(); ctx.arc(S/2,S/2,S/2,0,Math.PI*2); ctx.clip();
      const scale = _cropZoom;
      const iw = _cropImg.width * scale, ih = _cropImg.height * scale;
      const x = S/2 - iw/2 + _cropOffset.x;
      const y = S/2 - ih/2 + _cropOffset.y;
      ctx.drawImage(_cropImg, x, y, iw, ih);
      ctx.restore();
    }

    document.getElementById('crop-zoom').addEventListener('input', (e) => { _cropZoom = parseFloat(e.target.value); drawCrop(); });

    const cropCanvas = document.getElementById('crop-canvas');
    cropCanvas.addEventListener('mousedown', (e) => { _cropDrag = {sx: e.clientX - _cropOffset.x, sy: e.clientY - _cropOffset.y}; });
    cropCanvas.addEventListener('mousemove', (e) => { if (!_cropDrag) return; _cropOffset.x = e.clientX - _cropDrag.sx; _cropOffset.y = e.clientY - _cropDrag.sy; drawCrop(); });
    cropCanvas.addEventListener('mouseup', () => { _cropDrag = null; });
    cropCanvas.addEventListener('mouseleave', () => { _cropDrag = null; });
    cropCanvas.addEventListener('touchstart', (e) => { const t=e.touches[0]; _cropDrag={sx:t.clientX-_cropOffset.x,sy:t.clientY-_cropOffset.y}; }, {passive:true});
    cropCanvas.addEventListener('touchmove', (e) => { if(!_cropDrag)return; const t=e.touches[0]; _cropOffset.x=t.clientX-_cropDrag.sx; _cropOffset.y=t.clientY-_cropDrag.sy; drawCrop(); }, {passive:true});
    cropCanvas.addEventListener('touchend', () => { _cropDrag=null; });

    function closeCropModal() { document.getElementById('avatar-modal').classList.add('hidden'); }

    async function confirmCrop() {
      const canvas = document.getElementById('crop-canvas');
      canvas.toBlob(async (blob) => {
        const fd = new FormData();
        fd.append('avatar', blob, 'avatar.png');
        const token = localStorage.getItem('access_token');
        const res = await fetch('/api/auth/avatar/upload/', {
          method: 'POST',
          headers: { Authorization: `Bearer ${token}` },
          body: fd,
        });
        const data = await res.json();
        closeCropModal();
        if (data.avatar_url) {
          toast('Profile picture updated', 'success');
          if (_cropCallback) _cropCallback(data.avatar_url);
        } else {
          toast(data.error || 'Upload failed', 'error');
        }
      }, 'image/png');
    }
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
