{% extends "base/layout.html" %}
{% block title %}Task Detail — FlowTrace{% endblock %}
{% block body %}
<div data-workspace="{{ workspace_slug }}" class="min-h-screen p-8 max-w-3xl mx-auto">
  <div class="mb-4">
    <a href="/tasks/{{ workspace_slug }}/" class="text-muted text-sm hover:text-white">← Back to Tasks</a>
  </div>

  <div id="task-header" class="bg-panel border border-border rounded-xl p-6 mb-6">
    <div class="text-white text-xl font-semibold" id="task-title">Loading...</div>
    <div class="text-muted text-sm mt-1" id="task-desc"></div>
    <div class="flex items-center gap-4 mt-4">
      <span id="task-status" class="text-xs px-2 py-0.5 rounded border border-border text-muted">—</span>
      <div class="flex items-center gap-2 flex-1">
        <div class="flex-1 bg-surface rounded-full h-1.5">
          <div id="task-progress" class="bg-accent h-1.5 rounded-full" style="width:0%"></div>
        </div>
        <span id="task-pct" class="text-muted text-xs">0%</span>
      </div>
    </div>
  </div>

  <!-- Comments -->
  <div class="bg-panel border border-border rounded-xl p-6">
    <h2 class="text-white text-sm font-medium mb-4">Comments</h2>
    <div id="comments-list" class="space-y-3 mb-4"></div>
    <div class="relative">
      <textarea id="comment-input" rows="3" placeholder="Add a comment... use @username to mention"
        class="w-full bg-surface border border-border rounded-md px-3 py-2 text-white text-sm focus:outline-none focus:border-accent resize-none"></textarea>
      <div id="mention-dropdown" class="hidden absolute bottom-full left-0 bg-panel border border-border rounded-md shadow-lg z-10 w-48"></div>
      <button onclick="postComment()" class="mt-2 px-4 py-1.5 bg-accent text-surface text-sm font-medium rounded-md hover:bg-blue-400 transition">
        Post Comment
      </button>
    </div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
const slug = '{{ workspace_slug }}';
const taskId = {{ task_id }};

async function loadTask() {
  const t = await API.get(`/api/tasks/${slug}/${taskId}/`);
  if (!t) return;
  document.getElementById('task-title').textContent = t.title;
  document.getElementById('task-desc').textContent = t.description || '';
  document.getElementById('task-status').textContent = t.status;
  document.getElementById('task-progress').style.width = `${t.completion_percentage}%`;
  document.getElementById('task-pct').textContent = `${t.completion_percentage}%`;
}

async function loadComments() {
  const data = await API.get(`/api/comments/${slug}/tasks/${taskId}/`);
  const comments = data.results || data;
  document.getElementById('comments-list').innerHTML = comments.map(c => `
    <div class="bg-surface rounded-lg p-3">
      <div class="flex items-center gap-2 mb-1">
        <span class="text-accent text-xs font-mono">${c.author_username}</span>
        <span class="text-muted text-xs">${new Date(c.created_at).toLocaleString()}</span>
      </div>
      <div class="text-white text-sm">${c.body.replace(/@(\w+)/g, '<span class="text-accent">@$1</span>')}</div>
    </div>
  `).join('') || '<div class="text-muted text-xs">No comments yet</div>';
}

async function postComment() {
  const body = document.getElementById('comment-input').value.trim();
  if (!body) return;
  await API.post(`/api/comments/${slug}/tasks/${taskId}/`, { body });
  document.getElementById('comment-input').value = '';
  loadComments();
}

// Mention autocomplete
document.getElementById('comment-input').addEventListener('input', async (e) => {
  const val = e.target.value;
  const match = val.match(/@(\w*)$/);
  const dropdown = document.getElementById('mention-dropdown');
  if (!match) { dropdown.classList.add('hidden'); return; }
  const q = match[1];
  const suggestions = await API.get(`/api/comments/${slug}/suggest/?q=${q}`);
  if (!suggestions || !suggestions.length) { dropdown.classList.add('hidden'); return; }
  dropdown.innerHTML = suggestions.map(u => `<div class="px-3 py-2 text-sm text-white hover:bg-surface cursor-pointer" onclick="insertMention('${u}')">${u}</div>`).join('');
  dropdown.classList.remove('hidden');
});

function insertMention(username) {
  const input = document.getElementById('comment-input');
  input.value = input.value.replace(/@\w*$/, `@${username} `);
  document.getElementById('mention-dropdown').classList.add('hidden');
  input.focus();
}

loadTask();
loadComments();
</script>
{% endblock %}
